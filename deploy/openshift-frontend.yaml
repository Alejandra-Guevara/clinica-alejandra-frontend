# Importar/aplicar en maria-guevara-rio-dev. Actualiza el frontend existente.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: clinica-alejandra-frontend
  namespace: maria-guevara-rio-dev
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: clinica-alejandra-frontend
  namespace: maria-guevara-rio-dev
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/Alejandra-Guevara/clinica-alejandra-frontend.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: clinica-alejandra-frontend:latest
  triggers:
    - type: ConfigChange
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clinica-alejandra-frontend
  namespace: maria-guevara-rio-dev
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containers:
        - name: clinica-alejandra-frontend
          image: image-registry.openshift-image-registry.svc:5000/maria-guevara-rio-dev/clinica-alejandra-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
  traffic:
    - latestRevision: true
      percent: 100
